name: UCI
run-name: UCI / Stale Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  stale:
    name: Stale
    permissions:
      issues: write
      pull-requests: write
    uses: sei-protocol/uci/.github/workflows/stale-check.yml@5acbd8eef65336b0619b46de3bfddfe84841a7fb # v0.0.9
    with: 
      days-before-pr-stale: 28