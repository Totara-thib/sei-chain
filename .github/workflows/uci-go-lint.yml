name: UCI
run-name: UCI / Go Lint

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go
    uses: sei-protocol/uci/.github/workflows/go-lint.yml@5acbd8eef65336b0619b46de3bfddfe84841a7fb # v0.0.9
    with:
      go-version: '1.27.4'