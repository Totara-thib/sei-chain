name: Mock Balances Build Check

on:
  pull_request:
    branches:
      - main
      - release/**
  merge_group:
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mock-balances-build:
    name: Compile with Mock Balances
    runs-on: ubuntu-latest
    steps:
      # See: https://github.com/actions/checkout/releases/tag/v7.0.0
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'

      - name: Build with Mock Balances
        run: make install-mock-balances
